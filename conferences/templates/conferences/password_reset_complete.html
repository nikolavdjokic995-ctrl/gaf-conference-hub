<!DOCTYPE html>
<html>
<head>
    <title>Password Changed | GAF Conference Hub</title>
    <style>
        body { margin:0; font-family:Arial,sans-serif; background:#f4f6f8; color:#17352a; }
        .header { background:linear-gradient(90deg,#064e3b,#075f46); color:white; padding:22px 34px; font-size:24px; font-weight:bold; }
        .box { width:430px; max-width:calc(100% - 40px); margin:70px auto; background:white; padding:34px; border-radius:18px; box-shadow:0 10px 28px rgba(0,0,0,.10); text-align:center; }
        h2 { margin-top:0; color:#064e3b; }
        p { line-height:1.6; color:#39584d; }
        a { display:inline-block; margin-top:18px; padding:11px 18px; background:#064e3b; color:white; border-radius:999px; font-weight:bold; text-decoration:none; }
    </style>
</head>
<body>
<div class="header">GAF Conference Hub</div>
<div class="box">
    <h2>Password successfully changed</h2>
    <p>Your password has been updated. You can now log in using your new password.</p>
    <a href="{% url 'login' %}">Go to login</a>
</div>
</body>
</html>
